name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: node tests/core.test.js
      # Forks that keep "Deploy from a branch" (or have Pages off) skip deployment instead of failing.
      - name: Check Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "Pages source: $type"
          echo "workflow=$([ "$type" = workflow ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Assemble site and stamp version
        if: steps.source.outputs.workflow == 'true'
        run: |
          mkdir _site
          cp -r index.html checklist.html css js _site/
          printf '(window.MdChecklist = window.MdChecklist || {}).version = { commit: "%s", date: "%s" };\n' \
            "$(git rev-parse --short HEAD)" "$(git log -1 --format=%cs)" > _site/js/version.js
          cat _site/js/version.js
      - if: steps.source.outputs.workflow == 'true'
        uses: actions/configure-pages@v5
      - if: steps.source.outputs.workflow == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        if: steps.source.outputs.workflow == 'true'
        uses: actions/deploy-pages@v4
