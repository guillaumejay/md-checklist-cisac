<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="wrap">
    <header class="masthead">
      <h1 id="title">Checklist</h1>
      <div class="row"><span class="eyebrow" id="modeLabel"></span><button class="btn" id="homeButton">Library</button><button class="btn" id="langButton">FR</button></div>
    </header>
    <div class="gauge">
      <div class="gauge-top"><span class="gauge-count" id="count">0 / 0</span><span id="countLabel"></span></div>
      <div class="gauge-track"><div class="gauge-fill" id="fill"></div></div>
    </div>
    <div class="bar">
      <button class="btn" id="editButton">Edit Markdown</button>
      <button class="btn" id="resetButton">Uncheck all</button>
      <button class="btn" id="saveButton">Save now</button>
      <button class="btn" id="refreshButton">Refresh</button>
      <button class="btn" id="shareButton">Copy read-only link</button>
    </div>
    <div class="sheet" id="sheet"></div>
    <textarea id="editor" class="hidden" spellcheck="false"></textarea>
    <p class="status" id="status" aria-live="polite"></p>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/gist.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/checklist.js"></script>
</body>
</html>
