<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist</title>
<style>
  :root{
    --paper:#E6EBEF;
    --card:#FFFFFF;
    --ink:#0F1B26;
    --muted:#5A6C7C;
    --line:#C9D4DC;
    --line-soft:#E4EAEF;
    --accent:#0E7C6B;
    --accent-soft:#DDEFEA;
    --warn:#8A5A12;
    --warn-soft:#FBF0DC;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px 16px 40px;
    background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto}

  .masthead{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--ink);
  }
  .masthead h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-0.01em}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--muted);
  }

  .gauge{margin:18px 0 20px}
  .gauge-top{display:flex;align-items:baseline;gap:10px;
    font-family:var(--mono);font-size:13px;color:var(--muted)}
  .gauge-count{font-size:22px;color:var(--ink);font-weight:600;letter-spacing:-0.02em}
  .gauge-track{margin-top:8px;height:6px;background:var(--line-soft);
    border-radius:999px;overflow:hidden}
  .gauge-fill{height:100%;width:0;background:var(--accent);
    border-radius:999px;transition:width .25s ease}

  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .btn{
    font-family:var(--mono);font-size:12px;letter-spacing:0.04em;
    padding:7px 12px;border:1px solid var(--line);border-radius:7px;
    background:var(--card);color:var(--ink);cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--muted)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.is-on{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .btn.danger{color:var(--warn)}

  .sheet{background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:6px 0}

  .head{
    padding:20px 16px 8px;font-size:12px;font-family:var(--mono);
    letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--line-soft);margin-bottom:6px;
  }
  .head:first-child{padding-top:12px}
  .note{padding:4px 16px 4px 60px;font-size:14px;color:var(--muted)}

  .task{
    display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    padding:9px 16px;border:0;background:none;font:inherit;color:inherit;
    cursor:pointer;border-radius:6px;
  }
  .task:hover{background:#F5F8FA}
  .task:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .idx{font-family:var(--mono);font-size:11px;color:var(--muted);
    width:20px;flex:none;padding-top:4px;text-align:right}
  .tick{
    width:19px;height:19px;flex:none;margin-top:2px;
    border:1.5px solid var(--line);border-radius:5px;
    display:grid;place-items:center;transition:background .15s, border-color .15s;
  }
  .tick svg{width:11px;height:11px;stroke:var(--card);stroke-width:2.6;fill:none;
    stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);
    transition:opacity .15s, transform .15s}
  .task[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
  .task[aria-pressed="true"] .tick svg{opacity:1;transform:scale(1)}
  .task[aria-pressed="true"] .txt{color:var(--muted);text-decoration:line-through;
    text-decoration-color:var(--line)}
  .task[aria-pressed="true"] .idx{color:var(--accent)}
  .txt{flex:1;padding-top:1px}
  .txt code{font-family:var(--mono);font-size:.85em;background:var(--accent-soft);
    padding:1px 5px;border-radius:4px}
  .txt a{color:var(--accent)}
  .sub{margin-left:22px}

  textarea{
    width:100%;min-height:320px;padding:16px;
    font-family:var(--mono);font-size:13.5px;line-height:1.65;
    color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:10px;resize:vertical;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

  .strip{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}
  .strip-label{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--muted);margin-bottom:7px;
    display:flex;justify-content:space-between;gap:10px}
  .url{
    width:100%;padding:10px 12px;font-family:var(--mono);font-size:11.5px;
    line-height:1.5;color:var(--muted);background:#DFE6EB;
    border:1px solid var(--line);border-radius:7px;white-space:nowrap;overflow-x:auto;
  }
  .url:focus{outline:2px solid var(--accent);outline-offset:1px}
  .hint{font-size:13px;color:var(--muted);margin-top:10px}
  .mem{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:14px}
  .mem.off{color:var(--warn)}

  .gist{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .gist-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .gist-token{flex:1;min-width:190px;padding:9px 11px;font-family:var(--mono);font-size:12px;
    color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:7px}
  .gist-token:focus{outline:2px solid var(--accent);outline-offset:1px}
  .gist-status{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .gist-status.error{color:var(--warn)}

  .hidden{display:none}
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>

<div class="wrap">

  <div class="masthead">
    <h1 id="title">Checklist</h1>
    <span class="eyebrow" id="crumb">mémorisée sur cet appareil</span>
  </div>

  <div class="gauge" id="gauge">
    <div class="gauge-top">
      <span class="gauge-count" id="count">0 / 0</span>
      <span id="countLabel">étapes faites</span>
    </div>
    <div class="gauge-track"><div class="gauge-fill" id="fill"></div></div>
  </div>

  <div class="bar">
    <button class="btn" id="toggleEdit">Modifier le texte</button>
    <button class="btn" id="reset">Tout décocher</button>
    <button class="btn" id="toggleLang">EN</button>
  </div>

  <div class="sheet" id="sheet"></div>
  <textarea id="editor" class="hidden" spellcheck="false" aria-label="Source markdown"></textarea>
  <div class="strip" id="strip">
    <div class="gist">
      <div class="strip-label"><span id="gistLabel">Stockage GitHub Gist</span></div>
      <div class="gist-row" id="gistSetup">
        <input class="gist-token" id="gistToken" type="password" autocomplete="off" placeholder="github_pat_…">
        <button class="btn" id="gistConnect">Créer le Gist</button>
      </div>
      <div class="gist-row hidden" id="gistActions">
        <button class="btn" id="gistSave">Sauvegarder maintenant</button>
        <button class="btn" id="gistLoad">Rafraîchir</button>
        <button class="btn" id="gistCopy">Copier le lien de partage</button>
        <button class="btn danger" id="gistDisconnect">Déconnecter</button>
      </div>
      <p class="gist-status" id="gistStatus"></p>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  const DEFAULT = `# Dépannage AP UniFi

## Alimentation
- [ ] Couper le PoE des deux AP 30 s, rebrancher, attendre 5 min
- [ ] Vérifier que l'injecteur est bien **802.3af** (~13 W par U7 Lite)
- [ ] Vérifier le budget PoE total du switch

## Garage — bloqué en Adopting
- [ ] Reset usine : bouton \`reset\` 10 s jusqu'au clignotement
- [ ] Ré-adopter en filaire si possible
- [ ] Mettre à jour le firmware après adoption

## Chambre Mathieu — Isolated
- [ ] Vérifier si l'AP est en mesh ou en filaire
  - En mesh, contrôler le signal vers l'UDR7
- [ ] Tester le câble et le port du switch
- [ ] Rapprocher l'AP si le lien mesh est faible

## Fond
- [ ] Firmware UDR7 à jour
- [ ] Firmware des deux U7 Lite à jour`;

  const GIST_ID = 'mdck!gist-id';
  const GIST_TOKEN = 'mdck!gist-token';
  const GIST_FILE = 'md-checklist.json';

  const $ = id => document.getElementById(id);
  const sheet=$('sheet'), editor=$('editor'),
        countEl=$('count'), labelEl=$('countLabel'), fillEl=$('fill'),
        titleEl=$('title'), crumb=$('crumb'),
        gauge=$('gauge'), strip=$('strip');

  let lines = [];
  let fp = null;
  let view = 'list';            // list | edit

  /* ---------- stockage : localStorage, sinon mémoire volatile ---------- */
  const mem = new Map();
  let persistent = true;
  try {
    localStorage.setItem('mdck!probe','1');
    localStorage.removeItem('mdck!probe');
  } catch(e){ persistent = false; }

  const store = {
    get(k){
      try { return persistent ? localStorage.getItem(k) : (mem.has(k)?mem.get(k):null); }
      catch(e){ return null; }
    },
    set(k,v){
      try { persistent ? localStorage.setItem(k,v) : mem.set(k,v); } catch(e){}
    },
    del(k){
      try { persistent ? localStorage.removeItem(k) : mem.delete(k); } catch(e){}
    }
  };

  /* ---------- langue ---------- */
  const LANG_KEY = 'mdck!lang';
  const STR = {
    fr: {
      crumbList: 'synchronisée avec GitHub Gist',
      crumbLib: 'sur cet appareil',
      labelNone: 'aucune case à cocher',
      labelDone: 'terminé',
      labelProgress: 'étapes faites',
      clashTitle: 'Ce lien contient une progression différente',
      clashText: (a, b) => 'Le lien est à ' + a.done + '/' + a.total +
        ', la version enregistrée ici est à ' + b.done + '/' + b.total +
        '. Rien n\'est écrasé tant que tu n\'as pas choisi.',
      takeLink: 'Charger le lien',
      keepMine: 'Garder ma version',
      editText: 'Modifier le texte',
      viewList: 'Voir la checklist',
      copyLink: 'Copier le lien',
      linkCopied: 'Lien copié',
      linkSelected: 'Sélectionné — Ctrl+C',
      uncheckAll: 'Tout décocher',
      myLists: 'Mes checklists',
      newList: 'Nouvelle',
      exportLabel: 'Lien d\'export',
      urlAria: 'Lien contenant la checklist et son état',
      hint: 'Colle un lien ici et appuie sur Entrée pour l\'importer.',
      editorAria: 'Source markdown',
      memOn: 'Mémoire du navigateur active — la progression est conservée quand tu fermes la page.',
      memOff: 'Mémoire du navigateur indisponible ici : la progression ne survivra pas à la fermeture. Ouvre le fichier téléchargé pour l\'activer.',
      libEmpty: 'Aucune checklist mémorisée pour l\'instant.',
      libCurrent: 'ouverte',
      delConfirm: 'Confirmer',
      delLabel: 'Supprimer',
      delAria: name => 'Supprimer ' + name,
      charCount: n => n + ' caractères',
      untitled: 'Sans titre',
      checklist: 'Checklist',
      newListSeed: '# Nouvelle checklist\n\n- [ ] Première étape\n- [ ] Deuxième étape',
      dateLocale: 'fr-FR',
      langBtn: 'EN',
      langAria: 'Switch to English',
      gistLabel: 'Stockage GitHub Gist', gistTokenAria: 'Token GitHub avec permission Gists',
      gistConnect: 'Créer le Gist', gistSave: 'Sauvegarder maintenant', gistLoad: 'Rafraîchir',
      gistCopy: 'Copier le lien de partage', gistDisconnect: 'Déconnecter',
      gistReady: 'Accès complet — synchronisation automatique active.',
      gistReadonly: 'Lecture seule — les modifications sont désactivées.',
      gistIdle: 'Entre un token GitHub avec la permission Gists pour créer la checklist.',
      gistSaving: 'Sauvegarde en cours…', gistSaved: 'Sauvegarde synchronisée.',
      gistLoading: 'Restauration en cours…', gistLoaded: 'Sauvegarde restaurée.',
      gistCopied: 'Lien copié.', gistDisconnected: 'Gist déconnecté.',
      gistTokenMissing: 'Token GitHub manquant.',
      gistBadData: 'Le Gist ne contient pas une sauvegarde md-checklist valide.',
      gistError: msg => 'Erreur Gist : ' + msg,
    },
    en: {
      crumbList: 'synchronized with GitHub Gist',
      crumbLib: 'on this device',
      labelNone: 'no items to check',
      labelDone: 'done',
      labelProgress: 'steps done',
      clashTitle: 'This link holds different progress',
      clashText: (a, b) => 'The link is at ' + a.done + '/' + a.total +
        ', the version saved here is at ' + b.done + '/' + b.total +
        '. Nothing is overwritten until you choose.',
      takeLink: 'Load the link',
      keepMine: 'Keep my version',
      editText: 'Edit text',
      viewList: 'View checklist',
      copyLink: 'Copy link',
      linkCopied: 'Link copied',
      linkSelected: 'Selected — Ctrl+C',
      uncheckAll: 'Uncheck all',
      myLists: 'My checklists',
      newList: 'New',
      exportLabel: 'Export link',
      urlAria: 'Link containing the checklist and its state',
      hint: 'Paste a link here and press Enter to import it.',
      editorAria: 'Markdown source',
      memOn: 'Browser storage active — progress is kept when you close the page.',
      memOff: 'Browser storage unavailable here: progress won\'t survive closing the tab. Open the downloaded file to enable it.',
      libEmpty: 'No checklist saved yet.',
      libCurrent: 'open',
      delConfirm: 'Confirm',
      delLabel: 'Delete',
      delAria: name => 'Delete ' + name,
      charCount: n => n + ' characters',
      untitled: 'Untitled',
      checklist: 'Checklist',
      newListSeed: '# New checklist\n\n- [ ] First step\n- [ ] Second step',
      dateLocale: 'en-US',
      langBtn: 'FR',
      langAria: 'Passer en français',
      gistLabel: 'GitHub Gist storage', gistTokenAria: 'GitHub token with Gists permission',
      gistConnect: 'Create Gist', gistSave: 'Save now', gistLoad: 'Refresh',
      gistCopy: 'Copy sharing link', gistDisconnect: 'Disconnect',
      gistReady: 'Full access — automatic synchronization is active.',
      gistReadonly: 'Read only — editing is disabled.',
      gistIdle: 'Enter a GitHub token with Gists permission to create the checklist.',
      gistSaving: 'Backing up…', gistSaved: 'Backup synchronized.',
      gistLoading: 'Restoring…', gistLoaded: 'Backup restored.',
      gistCopied: 'Link copied.', gistDisconnected: 'Gist disconnected.',
      gistTokenMissing: 'GitHub token missing.',
      gistBadData: 'The Gist does not contain a valid md-checklist backup.',
      gistError: msg => 'Gist error: ' + msg,
    },
  };
  let lang = store.get(LANG_KEY) === 'en' ? 'en' : 'fr';
  const t = () => STR[lang];

  /* ---------- encodage ---------- */
  function pack(text){
    const bytes = new TextEncoder().encode(text);
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function unpack(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  }

  const RE_TASK = /^(\s*)[-*+]\s+\[([ xX])\]\s*(.*)$/;
  const RE_HEAD = /^(#{1,6})\s+(.*)$/;
  const RE_NOTE = /^(\s*)[-*+]\s+(.*)$/;

  /* ---------- identité : le texte, sans les cases ---------- */
  function fingerprint(text){
    const sig = text.split('\n').map(l => {
      let m;
      if ((m = l.match(RE_TASK))) return 'T' + m[3].trim().replace(/\s+/g,' ');
      if ((m = l.match(RE_HEAD))) return 'H' + m[2].trim().replace(/\s+/g,' ');
      return null;
    }).filter(Boolean).join('\u0001');

    let h = 0x811c9dc5;
    for (let i = 0; i < sig.length; i++){
      h ^= sig.charCodeAt(i);
      h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0;
    }
    return h.toString(36);
  }

  /* ---------- lecture ---------- */
  function stats(text){
    let done = 0, total = 0, title = null;
    text.split('\n').forEach(l => {
      let m;
      if ((m = l.match(RE_TASK))){ total++; if (m[2].toLowerCase()==='x') done++; }
      else if (title === null && (m = l.match(/^#\s+(.*)$/))) title = m[1].trim();
    });
    return {done, total, title: title || t().untitled};
  }

  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function inline(s){
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  /* ---------- rendu ---------- */
  function render(){
    sheet.innerHTML = '';
    let done = 0, total = 0, num = 0, h1 = null;

    lines.forEach((raw, i) => {
      let m;
      if ((m = raw.match(RE_TASK))){
        total++;
        const checked = m[2].toLowerCase() === 'x';
        if (checked) done++;
        const deep = m[1].length >= 2;
        if (!deep) num++;
        const btn = document.createElement('button');
        btn.className = 'task' + (deep ? ' sub' : '');
        btn.type = 'button';
        btn.disabled = isReadonly();
        btn.setAttribute('aria-pressed', String(checked));
        btn.innerHTML =
          '<span class="idx">' + (deep ? '' : num) + '</span>' +
          '<span class="tick"><svg viewBox="0 0 12 12"><path d="M2 6.3 4.6 9 10 3"/></svg></span>' +
          '<span class="txt">' + inline(m[3]) + '</span>';
        btn.addEventListener('click', () => toggle(i));
        sheet.appendChild(btn);
        return;
      }
      if ((m = raw.match(RE_HEAD))){
        if (h1 === null && m[1].length === 1){ h1 = m[2]; return; }
        const d = document.createElement('div');
        d.className = 'head'; d.innerHTML = inline(m[2]);
        sheet.appendChild(d); return;
      }
      if ((m = raw.match(RE_NOTE))){
        const d = document.createElement('div');
        d.className = 'note'; d.innerHTML = inline(m[2]);
        sheet.appendChild(d); return;
      }
      if (raw.trim()){
        const d = document.createElement('div');
        d.className = 'note'; d.innerHTML = inline(raw.trim());
        sheet.appendChild(d);
      }
    });

    titleEl.textContent = h1 || t().checklist;
    document.title = (h1 || t().checklist) + ' — ' + done + '/' + total;
    countEl.textContent = done + ' / ' + total;
    labelEl.textContent = total === 0 ? t().labelNone
                        : done === total ? t().labelDone : t().labelProgress;
    fillEl.style.width = total ? (done/total*100) + '%' : '0%';
    syncUrl();
  }

  function toggle(i){
    if (isReadonly()) return;
    lines[i] = lines[i].replace(RE_TASK, (_, sp, mark, txt) =>
      sp + '- [' + (mark.toLowerCase()==='x' ? ' ' : 'x') + '] ' + txt);
    render();
    persist();
  }

  function syncUrl(){
    // The URL identifies the Gist; checklist content never travels in it.
  }

  function persist(){
    const text = lines.join('\n');
    fp = fingerprint(text);
    scheduleGistSave();
  }

  function load(text, save){
    lines = text.replace(/\r\n?/g,'\n').split('\n');
    fp = fingerprint(lines.join('\n'));
    render();
    if (save !== false && !isReadonly()) persist();
  }

  /* ---------- vues ---------- */
  function refreshChrome(){
    $('toggleEdit').classList.toggle('is-on', view === 'edit');
    $('toggleEdit').textContent = view === 'edit' ? t().viewList : t().editText;
    crumb.textContent = isReadonly() ? t().gistReadonly : (gistConfig().id ? t().crumbList : t().gistIdle);
  }

  function showView(v){
    view = v;
    sheet.classList.toggle('hidden', v !== 'list');
    editor.classList.toggle('hidden', v !== 'edit');
    gauge.classList.remove('hidden');
    strip.classList.remove('hidden');
    refreshChrome();
    if (v === 'edit'){ editor.value = lines.join('\n'); editor.focus(); }
  }

  /* ---------- sauvegarde GitHub Gist ---------- */
  let gistTimer = null;
  let gistBusy = false;
  let lastGistPayload = null;

  function gistConfig(){ return {id:store.get(GIST_ID), token:store.get(GIST_TOKEN)}; }
  function isReadonly(){ const cfg=gistConfig(); return !!cfg.id && !cfg.token; }
  function gistSnapshot(){
    return {version:2, md:lines.join('\n'), updatedAt:new Date().toISOString()};
  }
  function validGistSnapshot(value){
    return value && value.version === 2 && typeof value.md === 'string';
  }
  function gistMessage(message, error){
    const el = $('gistStatus');
    el.textContent = message;
    el.classList.toggle('error', !!error);
  }
  function refreshGist(){
    const cfg = gistConfig(), linked = !!cfg.id, readonly = linked && !cfg.token;
    $('gistSetup').classList.toggle('hidden', linked);
    $('gistActions').classList.toggle('hidden', !linked);
    $('gistSave').classList.toggle('hidden', readonly);
    $('toggleEdit').disabled = readonly;
    $('reset').disabled = readonly;
    crumb.textContent = readonly ? t().gistReadonly : (linked ? t().crumbList : t().gistIdle);
    if (!gistBusy) gistMessage(linked ? (readonly ? t().gistReadonly : t().gistReady) : t().gistIdle, false);
  }
  async function gistRequest(path, init){
    let response;
    try { response = await fetch('https://api.github.com/gists' + path, init); }
    catch(e){ throw new Error('GitHub inaccessible'); }
    if (!response.ok){
      if (response.status === 401 || response.status === 403){
        const error = new Error('token invalide ou accès refusé');
        error.auth = true;
        throw error;
      }
      if (response.status === 404) throw new Error('Gist introuvable');
      throw new Error('HTTP ' + response.status);
    }
    return response.json();
  }
  function gistHeaders(token){
    return {Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
      Authorization:'Bearer ' + token,'Content-Type':'application/json'};
  }
  async function saveGist(force){
    const cfg = gistConfig();
    if (!cfg.id || !cfg.token || gistBusy) return;
    const payload = JSON.stringify(gistSnapshot());
    if (!force && payload === lastGistPayload) return;
    gistBusy = true; gistMessage(t().gistSaving, false);
    try {
      await gistRequest('/' + encodeURIComponent(cfg.id), {method:'PATCH',headers:gistHeaders(cfg.token),
        body:JSON.stringify({files:{[GIST_FILE]:{content:payload}}})});
      lastGistPayload = payload; gistMessage(t().gistSaved, false);
    } catch(e){
      if (e.auth){ store.del(GIST_TOKEN); refreshGist(); }
      gistMessage(t().gistError(e.message), true);
    }
    finally { gistBusy = false; }
  }
  function scheduleGistSave(){
    clearTimeout(gistTimer);
    if (!gistConfig().id || !gistConfig().token) return;
    gistTimer = setTimeout(() => saveGist(false), 2000);
  }
  async function restoreGist(){
    const cfg = gistConfig(); if (!cfg.id || gistBusy) return;
    gistBusy = true; gistMessage(t().gistLoading, false);
    try {
      const gist = await gistRequest('/' + encodeURIComponent(cfg.id), {method:'GET',headers:{Accept:'application/vnd.github+json'}});
      const file = gist.files && gist.files[GIST_FILE];
      const snapshot = file && JSON.parse(file.content);
      if (!validGistSnapshot(snapshot)) throw new Error(t().gistBadData);
      load(snapshot.md, false);
      lastGistPayload = JSON.stringify(snapshot);
      showView('list'); gistMessage(t().gistLoaded, false);
    } catch(e){ gistMessage(t().gistError(e.message), true); }
    finally { gistBusy = false; }
  }
  /* ---------- application de la langue ---------- */
  function applyLang(){
    document.documentElement.lang = lang;
    const langBtn = $('toggleLang');
    langBtn.textContent = t().langBtn;
    langBtn.setAttribute('aria-label', t().langAria);
    $('reset').textContent = t().uncheckAll;
    editor.setAttribute('aria-label', t().editorAria);
    $('gistLabel').textContent = t().gistLabel;
    $('gistConnect').textContent = t().gistConnect;
    $('gistSave').textContent = t().gistSave;
    $('gistLoad').textContent = t().gistLoad;
    $('gistCopy').textContent = t().gistCopy;
    $('gistDisconnect').textContent = t().gistDisconnect;
    $('gistToken').setAttribute('aria-label', t().gistTokenAria);
    refreshChrome();
    render();
    refreshGist();
  }

  /* ---------- contrôles ---------- */
  $('toggleEdit').addEventListener('click', () => {
    if (view === 'edit'){ load(editor.value); showView('list'); }
    else showView('edit');
  });

  $('toggleLang').addEventListener('click', () => {
    lang = lang === 'fr' ? 'en' : 'fr';
    store.set(LANG_KEY, lang);
    applyLang();
  });

  $('reset').addEventListener('click', () => {
    lines = lines.map(l => l.replace(RE_TASK, (_, sp, mk, tx) => sp + '- [ ] ' + tx));
    render(); persist();
  });

  $('gistConnect').addEventListener('click', async () => {
    const token = $('gistToken').value.trim();
    if (!token){ gistMessage(t().gistTokenMissing, true); return; }
    gistBusy = true; gistMessage(t().gistSaving, false);
    try {
      const payload = JSON.stringify(gistSnapshot());
      const gist = await gistRequest('', {method:'POST',headers:gistHeaders(token),body:JSON.stringify({
        description:'md-checklist — sauvegarde',public:false,files:{[GIST_FILE]:{content:payload}}
      })});
      store.set(GIST_ID,gist.id); store.set(GIST_TOKEN,token);
      try { history.replaceState(null, '', '#gist=' + encodeURIComponent(gist.id)); } catch(e){}
      $('gistToken').value=''; lastGistPayload=payload;
      gistBusy=false; refreshGist(); gistMessage(t().gistSaved, false);
    } catch(e){ gistBusy=false; gistMessage(t().gistError(e.message), true); }
  });
  $('gistSave').addEventListener('click', () => saveGist(true));
  $('gistLoad').addEventListener('click', restoreGist);
  function appLink(){
    const cfg=gistConfig(), base=location.href.replace(/#.*$/, '');
    return base + '#gist=' + encodeURIComponent(cfg.id) + '&mode=read';
  }
  async function copyGistLink(){
    const link=appLink();
    try { await navigator.clipboard.writeText(link); gistMessage(t().gistCopied, false); }
    catch(e){ window.prompt(t().gistCopy, link); }
  }
  $('gistCopy').addEventListener('click', copyGistLink);
  $('gistDisconnect').addEventListener('click', () => {
    clearTimeout(gistTimer); store.del(GIST_ID); store.del(GIST_TOKEN); lastGistPayload=null;
    try { history.replaceState(null, '', location.href.replace(/#.*$/, '')); } catch(e){}
    refreshGist(); gistMessage(t().gistDisconnected, false);
  });
  /* ---------- démarrage ---------- */
  const linkParams = new URLSearchParams(location.hash.replace(/^#/, ''));
  const linkedId = linkParams.get('gist');
  if (linkedId){
    store.set(GIST_ID, linkedId);
    if (linkParams.get('mode') === 'read') store.del(GIST_TOKEN);
  }
  load(DEFAULT, false);
  showView('list');
  applyLang();
  if (gistConfig().id) restoreGist();
  setInterval(() => {
    if (isReadonly() && document.visibilityState !== 'hidden') restoreGist();
  }, 30000);
})();
</script>
